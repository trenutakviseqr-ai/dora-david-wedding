
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dora &amp; David 🤎</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --champagne: #e8d8c3;
  --champagne-light: #f5eee5;
  --cream: #faf7f2;
  --beige: #d8c4aa;
  --taupe: #a98f78;
  --brown: #765844;
  --dark-brown: #4d382b;
  --deep-brown: #34251d;
  --gold: #b18a5a;
  --soft-gold: #c7a77a;
  --white: #fffdf9;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 35%),
    linear-gradient(135deg, #f7f1e9 0%, #e9dccd 45%, #d9c5ae 100%);
  color: var(--dark-brown);
  overflow-x: hidden;
}

body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}

body::before {
  width: 360px;
  height: 360px;
  top: -100px;
  left: -100px;
  background: radial-gradient(circle, rgba(177,138,90,.13), transparent 65%);
}

body::after {
  width: 450px;
  height: 450px;
  bottom: -180px;
  right: -150px;
  background: radial-gradient(circle, rgba(118,88,68,.12), transparent 65%);
}

.frame {
  position: fixed;
  top: 18px;
  left: 18px;
  right: 18px;
  bottom: 18px;
  border: 1px solid rgba(118,88,68,.25);
  z-index: 10;
  pointer-events: none;
}

.frame::before,
.frame::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 1px solid var(--gold);
}

.frame::before {
  top: -1px;
  left: -1px;
  border-right: none;
  border-bottom: none;
}

.frame::after {
  bottom: -1px;
  right: -1px;
  border-left: none;
  border-top: none;
}

/* POČETNI EKRAN */

#login {
  position: fixed;
  inset: 0;
  background-color: #6d5746;
  background-image:
    linear-gradient(rgba(52,37,29,.38), rgba(52,37,29,.63)),
    url("hero.jpg");
  background-size: cover;
  background-position: center 45%;
  background-repeat: no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  padding: 25px;
}

.login-box {
  width: 100%;
  max-width: 390px;
  padding: 50px 35px;
  text-align: center;
  color: white;
  background: rgba(255,248,238,.16);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 4px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.login-box::before {
  content: "✦";
  display: block;
  color: #e5c99e;
  font-size: 20px;
  margin-bottom: 10px;
}

.login-box h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 58px;
  font-weight: 400;
  margin: 0 0 15px;
  line-height: 1.1;
  color: #fffaf2;
  text-shadow: 0 2px 12px rgba(0,0,0,.3);
}

.login-box p {
  font-size: 19px;
  line-height: 1.5;
  letter-spacing: .5px;
  margin-bottom: 30px;
  color: #f8eee3;
}

.login-box strong {
  color: #ead0a6;
  font-weight: 500;
}

/* GUMBI */

button {
  font-family: 'Cormorant Garamond', serif;
  letter-spacing: 1px;
  cursor: pointer;
}

.main-button {
  width: 100%;
  padding: 15px 25px;
  border: 0;
  border-radius: 3px;
  background: linear-gradient(135deg, #8b6a50, #604635);
  color: #fff;
  font-size: 18px;
  transition: transform .25s, box-shadow .25s, background .25s;
  box-shadow: 0 8px 20px rgba(77,56,43,.25);
}

.main-button:hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg, #a27d5c, #70513c);
  box-shadow: 0 12px 25px rgba(77,56,43,.35);
}

button:disabled {
  opacity: .65;
  cursor: wait;
  transform: none;
}

/* NASLOVNA FOTOGRAFIJA */

/*
  hero1.jpg je pozadinska fotografija naslovnog dijela.
  Visina i položaj fotografije prilagođavaju se veličini ekrana.
*/

.hero {
  position: relative;
  isolation: isolate;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;

  min-height: 600px;
  height: 76vh;
  height: min(76svh, 850px);

  padding: 40px 20px;

  background-color: #e9dccd;
  background-image:
    linear-gradient(
      rgba(250,246,239,.28),
      rgba(250,246,239,.43)
    ),
    url("hero1.jpg");
  background-size: cover;
  background-position: center 42%;
  background-repeat: no-repeat;

  border-bottom: 1px solid rgba(118,88,68,.18);
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    to bottom,
    rgba(255,250,243,.02),
    rgba(255,250,243,.05) 45%,
    rgba(250,246,239,.23)
  );
  pointer-events: none;
}

.hero h1 {
  position: relative;
  font-family: 'Great Vibes', cursive;
  font-size: 92px;
  font-weight: 400;
  color: var(--dark-brown);
  margin: 0 0 20px;
  line-height: 1.08;
  text-shadow: 0 2px 15px rgba(255,255,255,.8);
}

.hero h1::after {
  content: "";
  display: block;
  width: 80px;
  height: 1px;
  background: var(--gold);
  margin: 18px auto 0;
}

.hero p {
  position: relative;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--brown);
  background: rgba(255,250,243,.9);
  padding: 12px 22px;
  border: 1px solid rgba(118,88,68,.25);
  margin: 0;
  box-shadow: 0 4px 18px rgba(77,56,43,.08);
}

/* UVOD */

.intro {
  max-width: 700px;
  margin: auto;
  text-align: center;
  padding: 48px 25px 30px;
  position: relative;
  z-index: 2;
}

.intro::before {
  content: "✦";
  display: block;
  font-size: 18px;
  color: var(--gold);
  margin-bottom: 10px;
}

.intro h2 {
  font-size: 38px;
  font-weight: 500;
  color: var(--dark-brown);
  margin: 0 0 10px;
  line-height: 1.2;
}

.intro p {
  font-size: 20px;
  color: var(--brown);
  margin: 0 0 25px;
  line-height: 1.4;
}

.upload-button {
  display: block;
  max-width: 300px;
  margin: auto;
}

#status {
  min-height: 24px;
  margin: 16px auto 0;
  max-width: 600px;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  color: var(--brown);
}

/* GALERIJA */

.gallery {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 22px;
  padding: 20px 30px 30px;
  position: relative;
  z-index: 2;
}

.gallery img {
  width: 100%;
  height: 270px;
  object-fit: cover;
  object-position: center;
  display: block;
  background: #eee4d8;
  border: 8px solid rgba(255,252,247,.9);
  box-shadow: 0 10px 30px rgba(77,56,43,.16);
  transition: transform .3s, box-shadow .3s;
  border-radius: 2px;
  cursor: zoom-in;
}

.gallery img:hover {
  transform: translateY(-4px) scale(1.015);
  box-shadow: 0 18px 35px rgba(77,56,43,.25);
}

.gallery:empty::before {
  content: "Vaše fotografije pojavit će se ovdje 🤎";
  grid-column: 1 / -1;
  text-align: center;
  font-size: 20px;
  color: var(--taupe);
  padding: 35px 20px;
}

.gallery-controls {
  text-align: center;
  position: relative;
  z-index: 2;
  padding: 0 20px 60px;
}

#loadMoreButton {
  display: none;
  width: auto;
  min-width: 220px;
  padding: 12px 25px;
  border: 1px solid var(--brown);
  background: rgba(255,250,243,.65);
  color: var(--dark-brown);
  font-size: 18px;
}

#loadMoreButton:hover {
  background: var(--champagne-light);
}

/* UVEĆANE FOTOGRAFIJE */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(30,21,16,.95);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 65px 70px 75px;
}

.lightbox.open {
  display: flex;
}

.lightbox-image {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  box-shadow: 0 10px 50px rgba(0,0,0,.35);
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,250,243,.14);
  border: 1px solid rgba(255,255,255,.35);
  color: white;
  width: 48px;
  height: 48px;
  padding: 0;
  font-family: Arial, sans-serif;
  font-size: 32px;
  line-height: 1;
  border-radius: 50%;
  box-shadow: none;
  transition: background .2s;
}

.lightbox-close:hover,
.lightbox-prev:hover,
.lightbox-next:hover {
  background: rgba(255,250,243,.3);
  transform: none;
  box-shadow: none;
}

.lightbox-close {
  top: 18px;
  right: 22px;
  font-size: 30px;
}

.lightbox-prev {
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
}

.lightbox-next {
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
}

.lightbox-prev:hover,
.lightbox-next:hover {
  transform: translateY(-50%);
}

.lightbox-count {
  position: absolute;
  bottom: 22px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff7ee;
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
}

/* TABLETI I MANJI LAPTOPI */

@media (min-width: 769px) and (max-width: 1100px) {
  .hero {
    height: 72vh;
    height: min(72svh, 760px);
    min-height: 520px;
    background-position: center 38%;
  }

  #login {
    background-position: center 38%;
  }

  .hero h1 {
    font-size: clamp(68px, 8vw, 84px);
  }

  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    padding-left: 22px;
    padding-right: 22px;
  }
}

/* MOBITELI */

@media (max-width: 768px) {
  .frame {
    top: 9px;
    left: 9px;
    right: 9px;
    bottom: 9px;
  }

  /*
    Naslovni dio je kraći, a tekst je postavljen
    pri dnu fotografije kako ne bi nastao prazan prostor.
  */

  .hero {
    height: 68vh;
    height: 68svh;
    min-height: 460px;
    max-height: 650px;
    padding: 24px 14px 28px;
    justify-content: flex-end;

    background-size: cover;
    background-position: center 30%;
    background-repeat: no-repeat;
  }

  .hero::before {
    background: linear-gradient(
      to bottom,
      rgba(250,246,239,.02) 0%,
      rgba(250,246,239,.02) 38%,
      rgba(250,246,239,.12) 62%,
      rgba(250,246,239,.48) 100%
    );
  }

  .hero h1 {
    font-size: clamp(48px, 10.5vw, 68px);
    line-height: 1.08;
    margin-bottom: 14px;
  }

  .hero h1::after {
    width: 64px;
    margin-top: 12px;
  }

  .hero p {
    font-size: 10px;
    letter-spacing: 2.5px;
    padding: 10px 14px;
  }

  .intro {
    padding: 34px 20px 25px;
  }

  .intro h2 {
    font-size: 32px;
    line-height: 1.15;
  }

  .intro p {
    font-size: 18px;
    margin-bottom: 22px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 15px 15px 25px;
  }

  .gallery img {
    height: 175px;
    border-width: 5px;
  }

  .login-box {
    padding: 40px 25px;
  }

  .login-box h1 {
    font-size: 52px;
  }

  #login {
    background-position: center 30%;
  }

  .lightbox {
    padding: 65px 12px 70px;
  }

  .lightbox-prev {
    left: 8px;
  }

  .lightbox-next {
    right: 8px;
  }

  .lightbox-close {
    top: 12px;
    right: 12px;
  }

  .lightbox-prev,
  .lightbox-next,
  .lightbox-close {
    width: 42px;
    height: 42px;
    font-size: 26px;
  }
}

/* VRLO USKI MOBITELI */

@media (max-width: 420px) {
  .hero {
    height: 64vh;
    height: 64svh;
    min-height: 430px;
    max-height: 560px;
    padding: 20px 10px 24px;
    background-position: center 28%;
  }

  .hero h1 {
    font-size: clamp(43px, 11.5vw, 55px);
  }

  .hero p {
    font-size: 9px;
    letter-spacing: 2px;
    padding: 9px 12px;
  }

  .intro {
    padding: 30px 17px 23px;
  }

  .intro h2 {
    font-size: 29px;
  }

  .intro p {
    font-size: 17px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding-left: 12px;
    padding-right: 12px;
  }

  .gallery img {
    height: 150px;
  }

  .login-box {
    padding: 35px 20px;
  }

  .login-box h1 {
    font-size: 48px;
  }

  #login {
    background-position: center 28%;
  }
}

/* MOBITEL U VODORAVNOM POLOŽAJU */

@media (max-width: 768px) and (orientation: landscape) {
  .hero {
    height: 100vh;
    height: 100svh;
    min-height: 360px;
    max-height: none;
    background-position: center 38%;
  }

  .hero h1 {
    font-size: clamp(42px, 7vw, 58px);
  }
}
</style>
</head>

<body>

<div class="frame"></div>

<div id="login">
  <div class="login-box">
    <h1>Dora &amp; David</h1>
    <p>
      <strong>7. studeni 2026</strong>
      <br><br>
      Dobrodošli na naš poseban dan 🤎
    </p>
    <button class="main-button" type="button" onclick="enter()">Uđi ✨</button>
  </div>
</div>

<section class="hero">
  <h1>Dora &amp; David</h1>
  <p>7. STUDENI 2026</p>
</section>

<section class="intro">
  <h2>Podijelite uspomene</h2>
  <p>Hvala što ste dio našeg najljepšeg dana 🤎</p>

  <button
    class="main-button upload-button"
    id="uploadButton"
    type="button"
    onclick="openUpload()"
  >
    📸 Dodaj fotografije
  </button>

  <input id="fileInput" type="file" accept="image/*" multiple hidden>

  <p id="status" role="status" aria-live="polite">
    Učitavam fotografije…
  </p>
</section>

<div class="gallery" id="gallery"></div>

<div class="gallery-controls">
  <button class="main-button" id="loadMoreButton" type="button">
    Učitaj još fotografija
  </button>
</div>

<div
  class="lightbox"
  id="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Pregled fotografija"
>
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Zatvori pregled">×</button>
  <button class="lightbox-prev" id="lightboxPrev" type="button" aria-label="Prethodna fotografija">‹</button>
  <img class="lightbox-image" id="lightboxImage" alt="Uvećana fotografija s vjenčanja Dora i David">
  <button class="lightbox-next" id="lightboxNext" type="button" aria-label="Sljedeća fotografija">›</button>
  <div class="lightbox-count" id="lightboxCount"></div>
</div>

<script>
/* Supabase postavke. Nikada ne stavljaj sb_secret_... ključ u HTML. */

const SUPABASE_URL = "https://mosjbllgcahaojofgulm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PLXyJNnxIGSZr3UsFr0z7w_kFtgwEMV";
const BUCKET_NAME = "dora-david-wedding";
const UPLOAD_FOLDER = "uploads";
const PAGE_SIZE = 100;

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const gallery = document.getElementById("gallery");
const fileInput = document.getElementById("fileInput");
const uploadButton = document.getElementById("uploadButton");
const statusBox = document.getElementById("status");
const loadMoreButton = document.getElementById("loadMoreButton");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxCount = document.getElementById("lightboxCount");

let imageItems = [];
let nextOffset = 0;
let hasMoreImages = false;
let isLoadingImages = false;
let currentImageIndex = -1;

function setStatus(message) {
  statusBox.textContent = message;
}

function enter() {
  document.getElementById("login").style.display = "none";
  loadImages(true);
}

function openUpload() {
  fileInput.click();
}

function makeSafeFileName(file) {
  const originalName = file.name.normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9._-]/g, "-")
    .replace(/-+/g, "-")
    .slice(-100);

  const match = originalName.match(/\.(jpg|jpeg|png|gif|webp|heic|heif|avif|bmp|tif|tiff)$/i);
  const extension = match ? match[0].toLowerCase() : "";
  const baseName = extension
    ? originalName.slice(0, -extension.length)
    : originalName;

  const unique = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;

  return `${UPLOAD_FOLDER}/${Date.now()}-${unique}-${baseName || "fotografija"}${extension}`;
}

fileInput.addEventListener("change", async () => {
  const files = Array.from(fileInput.files || []);

  if (!files.length) return;

  const invalid = files.filter(file => !file.type.startsWith("image/"));

  if (invalid.length) {
    setStatus("Molimo odaberite samo slikovne datoteke.");
    fileInput.value = "";
    return;
  }

  uploadButton.disabled = true;
  fileInput.disabled = true;

  let uploaded = 0;
  const failed = [];

  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];

      if (file.size > 10 * 1024 * 1024) {
        failed.push(`${file.name} (veća od 10 MB)`);
        continue;
      }

      setStatus(`Učitavam fotografiju ${i + 1} od ${files.length}…`);

      const { error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(makeSafeFileName(file), file, {
          cacheControl: "3600",
          contentType: file.type,
          upsert: false
        });

      if (error) {
        console.error("Supabase upload error:", error);
        failed.push(file.name);
      } else {
        uploaded++;
      }
    }

    await loadImages(true);

    if (!failed.length) {
      setStatus(
        uploaded === 1
          ? "Fotografija je uspješno dodana 🤎"
          : `Uspješno dodano fotografija: ${uploaded} 🤎`
      );
    } else {
      setStatus(
        `Uspješno dodano: ${uploaded}. Neuspješno: ${failed.join(", ")}. Provjerite Storage pravila i veličinu datoteka.`
      );
    }
  } catch (error) {
    console.error("Upload error:", error);
    setStatus("Došlo je do greške pri uploadu. Provjerite internetsku vezu i Supabase postavke.");
  } finally {
    uploadButton.disabled = false;
    fileInput.disabled = false;
    fileInput.value = "";
  }
});

function isImageFile(item) {
  return item &&
    item.name &&
    item.name !== ".emptyFolderPlaceholder" &&
    /\.(jpg|jpeg|png|gif|webp|heic|heif|avif|bmp|tif|tiff)$/i.test(item.name);
}

function getImageUrl(item) {
  const path = `${UPLOAD_FOLDER}/${item.name}`;

  return supabaseClient.storage
    .from(BUCKET_NAME)
    .getPublicUrl(path).data.publicUrl;
}

function renderGallery() {
  gallery.innerHTML = "";

  imageItems.forEach((item, index) => {
    const img = document.createElement("img");

    img.src = getImageUrl(item);
    img.alt = `Fotografija ${index + 1} s vjenčanja Dora i David`;
    img.loading = "lazy";
    img.decoding = "async";
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    img.setAttribute("aria-label", `Otvori fotografiju ${index + 1}`);

    img.addEventListener("click", () => openLightbox(index));

    img.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openLightbox(index);
      }
    });

    img.addEventListener("error", () => {
      img.alt = "Fotografija se ne može prikazati. Provjerite je li bucket javan.";
    });

    gallery.appendChild(img);
  });

  loadMoreButton.style.display = hasMoreImages ? "inline-block" : "none";
}

async function loadImages(reset = true) {
  if (isLoadingImages) return;

  isLoadingImages = true;
  loadMoreButton.disabled = true;

  if (reset) {
    imageItems = [];
    nextOffset = 0;
    gallery.innerHTML = "";
  }

  setStatus("Učitavam fotografije…");

  try {
    const { data, error } = await supabaseClient.storage
      .from(BUCKET_NAME)
      .list(UPLOAD_FOLDER, {
        limit: PAGE_SIZE,
        offset: nextOffset,
        sortBy: {
          column: "name",
          order: "desc"
        }
      });

    if (error) throw error;

    const files = (data || []).filter(isImageFile);

    imageItems = reset ? files : imageItems.concat(files);
    nextOffset += (data || []).length;
    hasMoreImages = (data || []).length === PAGE_SIZE;

    renderGallery();

    if (imageItems.length === 0) {
      setStatus("Još nema fotografija. Budite prvi i dodajte uspomenu 🤎");
    } else {
      setStatus(`Prikazano fotografija: ${imageItems.length} 🤎`);
    }
  } catch (error) {
    console.error("Supabase gallery error:", error);
    setStatus("Fotografije se nisu mogle učitati. Provjerite naziv bucketa, je li bucket javan i Storage pravila.");
  } finally {
    isLoadingImages = false;
    loadMoreButton.disabled = false;
  }
}

loadMoreButton.addEventListener("click", () => loadImages(false));

function openLightbox(index) {
  if (!imageItems.length || index < 0 || index >= imageItems.length) return;

  currentImageIndex = index;
  updateLightbox();
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("lightboxClose").focus();
}

function updateLightbox() {
  const item = imageItems[currentImageIndex];

  if (!item) return;

  lightboxImage.src = getImageUrl(item);
  lightboxImage.alt = `Fotografija ${currentImageIndex + 1} s vjenčanja Dora i David`;
  lightboxCount.textContent = `${currentImageIndex + 1} / ${imageItems.length}`;

  document.getElementById("lightboxPrev").style.visibility =
    imageItems.length > 1 ? "visible" : "hidden";

  document.getElementById("lightboxNext").style.visibility =
    imageItems.length > 1 ? "visible" : "hidden";
}

function showPreviousImage() {
  if (imageItems.length < 2) return;

  currentImageIndex =
    (currentImageIndex - 1 + imageItems.length) % imageItems.length;

  updateLightbox();
}

function showNextImage() {
  if (imageItems.length < 2) return;

  currentImageIndex =
    (currentImageIndex + 1) % imageItems.length;

  updateLightbox();
}

function closeLightbox() {
  lightbox.classList.remove("open");
  lightboxImage.removeAttribute("src");
  document.body.style.overflow = "";
  currentImageIndex = -1;
}

document.getElementById("lightboxClose")
  .addEventListener("click", closeLightbox);

document.getElementById("lightboxPrev")
  .addEventListener("click", showPreviousImage);

document.getElementById("lightboxNext")
  .addEventListener("click", showNextImage);

lightbox.addEventListener("click", event => {
  if (event.target === lightbox) closeLightbox();
});

document.addEventListener("keydown", event => {
  if (!lightbox.classList.contains("open")) return;

  if (event.key === "Escape") closeLightbox();
  if (event.key === "ArrowLeft") showPreviousImage();
  if (event.key === "ArrowRight") showNextImage();
});

let touchStartX = 0;

lightbox.addEventListener("touchstart", event => {
  touchStartX = event.changedTouches[0].screenX;
}, { passive: true });

lightbox.addEventListener("touchend", event => {
  const touchEndX = event.changedTouches[0].screenX;
  const difference = touchEndX - touchStartX;

  if (Math.abs(difference) > 50) {
    if (difference > 0) {
      showPreviousImage();
    } else {
      showNextImage();
    }
  }
}, { passive: true });

document.addEventListener("DOMContentLoaded", () => loadImages(true));
</script>
