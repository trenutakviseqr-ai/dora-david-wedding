
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5eee5">
<title>Dora &amp; David 🤎</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --cream: #faf7f2;
  --champagne: #e8d8c3;
  --beige: #d8c4aa;
  --taupe: #a98f78;
  --brown: #765844;
  --dark: #4d382b;
  --deep: #34251d;
  --gold: #b18a5a;
  --white: #fffdf9;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  color: var(--dark);
  font-family: 'Cormorant Garamond', serif;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.8), transparent 40%),
    linear-gradient(135deg, #faf7f2, #e9dccd 60%, #d9c5ae);
  overflow-x: hidden;
}

body.no-scroll { overflow: hidden; }

button { font-family: inherit; cursor: pointer; }

button:disabled { opacity: .6; cursor: wait; }

button:focus-visible,
.gallery img:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.frame {
  position: fixed;
  inset: 13px;
  border: 1px solid rgba(118,88,68,.25);
  z-index: 100;
  pointer-events: none;
}

.frame::before,
.frame::after {
  content: "";
  position: absolute;
  width: 13px;
  height: 13px;
  border: 1px solid var(--gold);
}

.frame::before {
  top: -1px;
  left: -1px;
  border-right: 0;
  border-bottom: 0;
}

.frame::after {
  right: -1px;
  bottom: -1px;
  border-left: 0;
  border-top: 0;
}

/* POČETNI EKRAN */

#login {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: auto;
  background: #6b5546;
}

.login-background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 40%;
}

.login-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    135deg,
    rgba(52,37,29,.35),
    rgba(52,37,29,.72)
  );
}

.login-box {
  position: relative;
  width: 100%;
  max-width: 410px;
  padding: 42px 30px;
  text-align: center;
  color: white;
  background: rgba(255,248,238,.15);
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 4px;
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.login-box::before {
  content: "✦";
  display: block;
  color: #ead0a6;
  font-size: 22px;
  margin-bottom: 12px;
}

.login-box h1 {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(48px, 10vw, 66px);
  font-weight: 400;
  line-height: 1.1;
  margin: 0 0 18px;
  color: #fffaf2;
  text-shadow: 0 2px 12px rgba(0,0,0,.25);
}

.login-box p {
  font-size: 20px;
  line-height: 1.5;
  margin: 0 0 28px;
}

.login-box strong {
  color: #f0d7ae;
  font-weight: 500;
}

/* GUMBI */

.main-button {
  display: block;
  width: 100%;
  max-width: 330px;
  margin: 0 auto;
  padding: 15px 20px;
  border: 0;
  border-radius: 3px;
  background: linear-gradient(135deg, #8b6a50, #604635);
  color: white;
  font-size: 19px;
  letter-spacing: .5px;
  box-shadow: 0 8px 20px rgba(77,56,43,.2);
  transition: transform .2s, box-shadow .2s, background .2s;
}

.main-button:hover {
  transform: translateY(-2px);
  background: linear-gradient(135deg, #a27d5c, #70513c);
  box-shadow: 0 12px 25px rgba(77,56,43,.25);
}

/* NASLOVNA */

.hero {
  position: relative;
  isolation: isolate;
  min-height: clamp(430px, 75vh, 760px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 50px 20px;
  overflow: hidden;
  background: #e9dccd;
  border-bottom: 1px solid rgba(118,88,68,.18);
}

.hero-background {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 40%;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    to bottom,
    rgba(250,246,239,.36),
    rgba(250,246,239,.54) 65%,
    rgba(250,246,239,.76)
  );
}

.hero h1 {
  font-family: 'Great Vibes', cursive;
  font-weight: 400;
  font-size: clamp(58px, 9vw, 100px);
  line-height: 1.12;
  color: var(--dark);
  margin: 0;
  text-shadow: 0 2px 15px rgba(255,255,255,.7);
}

.hero h1::after {
  content: "";
  display: block;
  width: 80px;
  height: 1px;
  background: var(--gold);
  margin: 17px auto 0;
}

.hero p {
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--brown);
  background: rgba(255,250,243,.9);
  border: 1px solid rgba(118,88,68,.2);
  padding: 12px 19px;
  margin: 20px 0 0;
}

/* UVOD */

.intro {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
  padding: 48px 22px 24px;
}

.intro::before {
  content: "✦";
  display: block;
  color: var(--gold);
  font-size: 21px;
  margin-bottom: 10px;
}

.intro h2 {
  font-size: clamp(30px, 5vw, 42px);
  font-weight: 500;
  line-height: 1.15;
  margin: 0 0 10px;
  color: var(--dark);
}

.intro p {
  font-size: clamp(18px, 3vw, 22px);
  line-height: 1.45;
  color: var(--brown);
  margin: 0 0 22px;
}

#fileInput { display: none; }

#status {
  min-height: 22px;
  max-width: 600px;
  margin: 15px auto 0;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  line-height: 1.7;
  color: var(--brown);
  overflow-wrap: anywhere;
}

/* GALERIJA */

.gallery {
  max-width: 1240px;
  margin: 0 auto;
  padding: 18px 28px 25px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 19px;
}

.gallery img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  object-position: center;
  background: #eee4d8;
  border: 6px solid rgba(255,252,247,.95);
  border-radius: 2px;
  box-shadow: 0 8px 25px rgba(77,56,43,.14);
  cursor: zoom-in;
  transition: transform .25s, box-shadow .25s;
}

.gallery img:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 30px rgba(77,56,43,.22);
}

.gallery:empty::before {
  content: "Vaše fotografije pojavit će se ovdje 🤎";
  grid-column: 1 / -1;
  text-align: center;
  font-size: 20px;
  color: var(--taupe);
  padding: 25px 10px;
}

.gallery-controls {
  text-align: center;
  padding: 0 20px 45px;
}

#loadMoreButton {
  display: none;
  max-width: 290px;
  background: rgba(255,250,243,.8);
  color: var(--dark);
  border: 1px solid var(--brown);
  box-shadow: none;
}

#loadMoreButton:hover {
  background: var(--champagne);
}

/* PREGLED FOTOGRAFIJA */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 65px 65px 70px;
  background: rgba(25,18,14,.96);
  touch-action: pan-y;
}

.lightbox.open { display: flex; }

.lightbox-image {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  box-shadow: 0 10px 50px rgba(0,0,0,.35);
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
  position: absolute;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 50%;
  color: white;
  background: rgba(255,250,243,.15);
  font-family: Arial, sans-serif;
  font-size: 29px;
  line-height: 1;
  box-shadow: none;
}

.lightbox-close:hover,
.lightbox-prev:hover,
.lightbox-next:hover {
  background: rgba(255,250,243,.3);
}

.lightbox-close {
  top: 14px;
  right: 14px;
}

.lightbox-prev {
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
}

.lightbox-next {
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
}

.lightbox-count {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff7ee;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
}

/* TABLETI */

@media (max-width: 1000px) {
  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
    padding-left: 22px;
    padding-right: 22px;
  }
}

/* MOBITELI: PRIKAZ CIJELE POZADINSKE FOTOGRAFIJE */

@media (max-width: 650px) {
  .frame { inset: 8px; }

  .hero {
    min-height: auto;
    padding: 0 0 25px;
    background: #e9dccd;
  }

  /*
    Na uskom ekranu slika je zaseban element.
    Visina je automatska pa se slika ne izrezuje po visini.
  */
  .hero-background {
    position: relative;
    inset: auto;
    z-index: 0;
    display: block;
    width: 100%;
    height: auto;
    max-height: 58svh;
    object-fit: contain;
    object-position: center top;
  }

  .hero::after {
    z-index: 1;
    background: linear-gradient(
      to bottom,
      rgba(250,246,239,.02),
      rgba(250,246,239,.12) 50%,
      #e9dccd 100%
    );
    pointer-events: none;
  }

  .hero h1,
  .hero p {
    position: relative;
    z-index: 2;
  }

  .hero h1 {
    font-size: clamp(48px, 12vw, 70px);
    line-height: 1.18;
    margin: -8px 8px 0;
  }

  .hero h1::after {
    width: 65px;
    margin-top: 12px;
  }

  .hero p {
    font-size: 10px;
    letter-spacing: 2px;
    padding: 10px 15px;
    margin-top: 14px;
  }

  .intro { padding: 32px 18px 18px; }
  .intro::before { margin-bottom: 7px; }
  .intro h2 { font-size: clamp(29px, 8vw, 35px); }
  .intro p { font-size: 18px; margin-bottom: 19px; }

  .main-button {
    font-size: 18px;
    padding: 14px 15px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
    padding: 12px 12px 22px;
  }

  .gallery img {
    aspect-ratio: 3 / 4;
    border-width: 4px;
  }

  .gallery-controls { padding-bottom: 30px; }

  .lightbox { padding: 60px 9px 60px; }
  .lightbox-close { top: 10px; right: 10px; }
  .lightbox-prev { left: 6px; }
  .lightbox-next { right: 6px; }

  .lightbox-close,
  .lightbox-prev,
  .lightbox-next {
    width: 40px;
    height: 40px;
    font-size: 25px;
  }
}

@media (max-width: 380px) {
  .login-box { padding: 30px 20px; }
  .login-box h1 { font-size: 47px; }
  .hero h1 { font-size: 47px; }
  .gallery { gap: 8px; padding-left: 9px; padding-right: 9px; }
  .gallery img { border-width: 3px; }
}

@media (max-height: 500px) and (max-width: 800px) {
  .login-box { padding-top: 20px; padding-bottom: 20px; }
  .login-box h1 { font-size: 42px; }
  .login-box p { margin-bottom: 14px; }
  .hero-background { max-height: 65svh; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<body>
<div class="frame" aria-hidden="true"></div>

<div id="login">
  <img class="login-background" src="hero.jpg" alt="" aria-hidden="true">
  <div class="login-overlay" aria-hidden="true"></div>
  <div class="login-box">
    <h1>Dora &amp; David</h1>
    <p><strong>7. studeni 2026.</strong><br><br>Dobrodošli na naš poseban dan 🤎</p>
    <button class="main-button" id="enterButton" type="button">Uđi ✨</button>
  </div>
</div>

<main>
  <section class="hero">
    <img class="hero-background" src="hero1.jpg" alt="" aria-hidden="true">
    <h1>Dora &amp; David</h1>
    <p>7. STUDENI 2026.</p>
  </section>

  <section class="intro">
    <h2>Podijelite uspomene</h2>
    <p>Hvala što ste dio našeg najljepšeg dana 🤎</p>
    <button class="main-button" id="uploadButton" type="button">📸 Dodaj fotografije</button>
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple>
    <p id="status" role="status" aria-live="polite">Povezujem galeriju…</p>
  </section>

  <section class="gallery" id="gallery" aria-label="Fotografije s vjenčanja"></section>

  <div class="gallery-controls">
    <button class="main-button" id="loadMoreButton" type="button">Učitaj još fotografija</button>
  </div>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Pregled fotografija">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Zatvori">×</button>
  <button class="lightbox-prev" id="lightboxPrev" type="button" aria-label="Prethodna fotografija">‹</button>
  <img class="lightbox-image" id="lightboxImage" alt="Uvećana fotografija s vjenčanja">
  <button class="lightbox-next" id="lightboxNext" type="button" aria-label="Sljedeća fotografija">›</button>
  <div class="lightbox-count" id="lightboxCount"></div>
</div>

<script>
/* SUPABASE POSTAVKE */
const SUPABASE_URL = "https://mosjbllgcahaojofgulm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PLXyJNnxIGSZr3UsFr0z7w_kFtgwEMV";
const BUCKET_NAME = "dora-david-wedding";
const UPLOAD_FOLDER = "uploads";
const PAGE_SIZE = 100;
const MAX_FILE_SIZE = 10 * 1024 * 1024;

const gallery = document.getElementById("gallery");
const fileInput = document.getElementById("fileInput");
const uploadButton = document.getElementById("uploadButton");
const statusBox = document.getElementById("status");
const loadMoreButton = document.getElementById("loadMoreButton");
const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxCount = document.getElementById("lightboxCount");

let supabaseClient = null;
let imageItems = [];
let currentImageIndex = -1;
let isLoadingImages = false;
let nextOffset = 0;
let hasMoreImages = false;
let touchStartX = 0;
let touchStartY = 0;

try {
  if (window.supabase && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );
  }
} catch (error) {
  console.error("Supabase initialization error:", error);
}

function setStatus(message) {
  statusBox.textContent = message;
}

function enter() {
  document.getElementById("login").style.display = "none";
  document.body.classList.remove("no-scroll");
  if (imageItems.length === 0) loadImages(true);
}

document.getElementById("enterButton").addEventListener("click", enter);

document.getElementById("uploadButton").addEventListener("click", () => {
  if (!supabaseClient) {
    setStatus("Supabase se nije učitao. Osvježite stranicu i pokušajte ponovno.");
    return;
  }
  fileInput.click();
});

/* Sigurno ime datoteke */
function makeSafeFileName(file) {
  const originalName = file.name.normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9._-]/g, "-")
    .replace(/-+/g, "-")
    .slice(-100);

  const match = originalName.match(/\.(jpg|jpeg|png|webp|gif|avif)$/i);
  const extension = match ? match[0].toLowerCase() : "";
  const baseName = extension
    ? originalName.slice(0, -extension.length)
    : originalName;

  const unique = window.crypto && crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;

  return `${Date.now()}-${unique}-${baseName || "fotografija"}${extension}`;
}

function isImageFile(item) {
  return Boolean(
    item &&
    item.name &&
    item.name !== ".emptyFolderPlaceholder" &&
    /\.(jpg|jpeg|png|webp|gif|avif|bmp|tif|tiff|heic|heif)$/i.test(item.name)
  );
}

function getImageUrl(item) {
  return supabaseClient.storage
    .from(BUCKET_NAME)
    .getPublicUrl(item.path)
    .data.publicUrl;
}

/*
  Čita fotografije iz korijena bucketa i iz mape uploads.
  Svaka stavka pamti svoju punu putanju, pa URL odgovara mjestu
  na kojem se datoteka stvarno nalazi.
*/
async function listImagesInFolder(folder, offset, limit) {
  const { data, error } = await supabaseClient.storage
    .from(BUCKET_NAME)
    .list(folder || "", {
      limit,
      offset,
      sortBy: { column: "name", order: "desc" }
    });

  if (error) throw error;

  return (data || [])
    .filter(isImageFile)
    .map(item => ({
      ...item,
      path: folder ? `${folder}/${item.name}` : item.name
    }));
}

async function fetchAllImageFiles() {
  const [rootItems, uploadItems] = await Promise.all([
    listImagesInFolder("", 0, 1000),
    listImagesInFolder(UPLOAD_FOLDER, 0, 1000)
  ]);

  const unique = new Map();

  [...rootItems, ...uploadItems].forEach(item => {
    unique.set(item.path, item);
  });

  return Array.from(unique.values()).sort((a, b) => {
    return b.name.localeCompare(a.name);
  });
}

/* UPLOAD */
fileInput.addEventListener("change", async () => {
  const files = Array.from(fileInput.files || []);
  if (!files.length) return;

  if (!supabaseClient) {
    setStatus("Supabase nije dostupan. Osvježite stranicu.");
    fileInput.value = "";
    return;
  }

  const invalid = files.filter(file =>
    !file.type.startsWith("image/") ||
    !/\.(jpg|jpeg|png|webp|gif|avif)$/i.test(file.name)
  );

  if (invalid.length) {
    setStatus("Odaberite fotografije u JPG, PNG, WEBP, GIF ili AVIF formatu.");
    fileInput.value = "";
    return;
  }

  const tooLarge = files.filter(file => file.size > MAX_FILE_SIZE);
  if (tooLarge.length) {
    setStatus("Svaka fotografija mora biti manja od 10 MB. Prevelike datoteke: " +
      tooLarge.map(file => file.name).join(", "));
    fileInput.value = "";
    return;
  }

  uploadButton.disabled = true;
  fileInput.disabled = true;

  let uploaded = 0;
  const failed = [];

  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const path = `${UPLOAD_FOLDER}/${makeSafeFileName(file)}`;

      setStatus(`Učitavam fotografiju ${i + 1} od ${files.length}…`);

      const { error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(path, file, {
          cacheControl: "3600",
          contentType: file.type,
          upsert: false
        });

      if (error) {
        console.error("Supabase upload error:", error);
        failed.push({ name: file.name, message: error.message });
      } else {
        uploaded++;
      }
    }

    await loadImages(true);

    if (failed.length === 0) {
      setStatus(
        uploaded === 1
          ? "Fotografija je uspješno dodana 🤎"
          : `Uspješno dodano fotografija: ${uploaded} 🤎`
      );
    } else {
      const firstError = failed[0].message || "Nepoznata greška";
      setStatus(
        `Uspješno dodano: ${uploaded}. Nije dodano: ${failed.length}. ` +
        `Greška: ${firstError}. Provjerite Supabase Storage pravila.`
      );
    }
  } catch (error) {
    console.error("Upload failed:", error);
    setStatus("Greška pri uploadu: " + (error.message || "provjerite vezu i Storage pravila."));
  } finally {
    uploadButton.disabled = false;
    fileInput.disabled = false;
    fileInput.value = "";
  }
});

/* GALERIJA I PAGINACIJA */
function renderGallery() {
  gallery.innerHTML = "";

  imageItems.forEach((item, index) => {
    const img = document.createElement("img");
    img.src = getImageUrl(item);
    img.alt = `Fotografija ${index + 1} s vjenčanja Dora i David`;
    img.loading = "lazy";
    img.decoding = "async";
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    img.setAttribute("aria-label", `Otvori fotografiju ${index + 1}`);

    img.addEventListener("click", () => openLightbox(index));
    img.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openLightbox(index);
      }
    });

    img.addEventListener("error", () => {
      img.alt = "Fotografija se ne može prikazati. Provjerite javni pristup bucketu i putanju.";
      img.classList.add("image-error");
      console.error("Image could not load:", item.path, img.src);
    });

    gallery.appendChild(img);
  });

  loadMoreButton.style.display = hasMoreImages ? "block" : "none";
}

async function loadImages(reset = true) {
  if (isLoadingImages) return;
  if (!supabaseClient) {
    setStatus("Supabase se nije učitao. Provjerite internetsku vezu.");
    return;
  }

  isLoadingImages = true;
  loadMoreButton.disabled = true;

  if (reset) {
    imageItems = [];
    nextOffset = 0;
    gallery.innerHTML = "";
  }

  setStatus("Učitavam fotografije…");

  try {
    /*
      Dohvaćamo datoteke iz oba moguća mjesta.
      Ako je datoteka u uploads, njezina putanja je uploads/ime.jpg.
      Ako je u korijenu, njezina putanja je ime.jpg.
    */
    const allItems = await fetchAllImageFiles();

    if (reset) {
      imageItems = allItems.slice(0, PAGE_SIZE);
      nextOffset = PAGE_SIZE;
    } else {
      const existing = new Set(imageItems.map(item => item.path));
      const remaining = allItems.filter(item => !existing.has(item.path));
      imageItems = imageItems.concat(remaining.slice(0, PAGE_SIZE));
      nextOffset += PAGE_SIZE;
    }

    hasMoreImages = allItems.length > imageItems.length;
    renderGallery();

    if (imageItems.length === 0) {
      setStatus("Još nema fotografija. Budite prvi i dodajte uspomenu 🤎");
    } else {
      setStatus(`Prikazano fotografija: ${imageItems.length} 🤎`);
    }
  } catch (error) {
    console.error("Supabase gallery error:", error);

    const message = error.message || "";
    if (/permission|policy|row-level|403|unauthorized/i.test(message)) {
      setStatus("Supabase je odbio pristup fotografijama. Provjerite Storage SELECT pravila za bucket.");
    } else {
      setStatus("Fotografije se nisu mogle učitati. Provjerite naziv bucketa, javni pristup i Storage pravila. " + message);
    }
  } finally {
    isLoadingImages = false;
    loadMoreButton.disabled = false;
  }
}

loadMoreButton.addEventListener("click", async () => {
  if (!hasMoreImages || isLoadingImages) return;

  loadMoreButton.disabled = true;
  setStatus("Učitavam još fotografija…");

  try {
    const allItems = await fetchAllImageFiles();
    const existing = new Set(imageItems.map(item => item.path));
    const remaining = allItems.filter(item => !existing.has(item.path));

    imageItems = imageItems.concat(remaining.slice(0, PAGE_SIZE));
    hasMoreImages = allItems.length > imageItems.length;

    renderGallery();
    setStatus(`Prikazano fotografija: ${imageItems.length} 🤎`);
  } catch (error) {
    console.error("Load more error:", error);
    setStatus("Nije moguće učitati još fotografija: " + (error.message || "provjerite Storage pravila."));
  } finally {
    loadMoreButton.disabled = false;
  }
});

/* UVEĆANI PREGLED */
function openLightbox(index) {
  if (index < 0 || index >= imageItems.length) return;

  currentImageIndex = index;
  updateLightbox();
  lightbox.classList.add("open");
  document.body.classList.add("no-scroll");
  document.getElementById("lightboxClose").focus();
}

function updateLightbox() {
  const item = imageItems[currentImageIndex];
  if (!item) return;

  lightboxImage.src = getImageUrl(item);
  lightboxImage.alt = `Fotografija ${currentImageIndex + 1} s vjenčanja Dora i David`;
  lightboxCount.textContent = `${currentImageIndex + 1} / ${imageItems.length}`;

  document.getElementById("lightboxPrev").style.visibility =
    imageItems.length > 1 ? "visible" : "hidden";

  document.getElementById("lightboxNext").style.visibility =
    imageItems.length > 1 ? "visible" : "hidden";
}

function showPreviousImage() {
  if (imageItems.length < 2) return;
  currentImageIndex = (currentImageIndex - 1 + imageItems.length) % imageItems.length;
  updateLightbox();
}

function showNextImage() {
  if (imageItems.length < 2) return;
  currentImageIndex = (currentImageIndex + 1) % imageItems.length;
  updateLightbox();
}

function closeLightbox() {
  lightbox.classList.remove("open");
  lightboxImage.removeAttribute("src");
  document.body.classList.remove("no-scroll");
  currentImageIndex = -1;
}

document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("lightboxPrev").addEventListener("click", showPreviousImage);
document.getElementById("lightboxNext").addEventListener("click", showNextImage);

lightbox.addEventListener("click", event => {
  if (event.target === lightbox) closeLightbox();
});

document.addEventListener("keydown", event => {
  if (!lightbox.classList.contains("open")) return;
  if (event.key === "Escape") closeLightbox();
  if (event.key === "ArrowLeft") showPreviousImage();
  if (event.key === "ArrowRight") showNextImage();
});

/* PRELAZAK IZMEĐU FOTOGRAFIJA POTEZOM PRSTA */
lightbox.addEventListener("touchstart", event => {
  touchStartX = event.changedTouches[0].screenX;
  touchStartY = event.changedTouches[0].screenY;
}, { passive: true });

lightbox.addEventListener("touchend", event => {
  const dx = event.changedTouches[0].screenX - touchStartX;
  const dy = event.changedTouches[0].screenY - touchStartY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    if (dx > 0) showPreviousImage();
    else showNextImage();
  }
}, { passive: true });

/* UČITAVANJE GALERIJE */
document.addEventListener("DOMContentLoaded", () => {
  if (!supabaseClient) {
    setStatus("Supabase se nije učitao. Osvježite stranicu.");
    return;
  }
  loadImages(true);
});
</script>
